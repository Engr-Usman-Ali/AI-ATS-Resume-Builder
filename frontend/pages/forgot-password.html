<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - AI Resume Builder</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    }
                }
            }
        }
    </script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body class="font-sans antialiased bg-gradient-to-br from-gray-50 to-blue-50 min-h-screen flex items-center justify-center p-4">
    
    <div class="w-full max-w-md animate-scale-in">
        <!-- Logo -->
        <div class="text-center mb-8">
            <a href="../index.html" class="inline-flex items-center justify-center space-x-2 mb-4">
                <div class="w-12 h-12 bg-gradient-to-br from-primary-500 to-primary-600 rounded-xl flex items-center justify-center">
                    <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                    </svg>
                </div>
            </a>
            <h1 class="text-3xl font-bold text-gray-900 mb-2">Reset Password</h1>
            <p class="text-gray-600">Enter your email to receive a password reset link</p>
        </div>
        
        <!-- Reset Password Card -->
        <div class="bg-white rounded-2xl shadow-xl p-8 border border-gray-200">
            <div id="alert-container"></div>
            
            <form id="forgot-password-form" class="space-y-5">
                <!-- Email -->
                <div>
                    <label for="email" class="block text-sm font-semibold text-gray-700 mb-2">
                        Email Address
                    </label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email"
                        class="input-field" 
                        placeholder="you@example.com"
                        required
                    >
                </div>
                
                <!-- Submit Button -->
                <button 
                    type="submit" 
                    id="reset-btn"
                    class="w-full btn-primary flex items-center justify-center"
                >
                    Send Reset Link
                    <svg class="w-5 h-5 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                    </svg>
                </button>
            </form>
            
            <!-- Back to Sign In -->
            <p class="mt-6 text-center text-sm text-gray-600">
                Remember your password? 
                <a href="signin.html" class="text-primary-600 hover:text-primary-700 font-semibold">
                    Sign in
                </a>
            </p>
        </div>
    </div>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
    
    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/auth.js"></script>
    
    <script>
        async function handleForgotPassword(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const resetBtn = document.getElementById('reset-btn');
            const originalText = resetBtn.innerHTML;
            
            if (!Utils.isValidEmail(email)) {
                Utils.showAlert('Please enter a valid email address', 'error');
                return;
            }
            
            try {
                resetBtn.innerHTML = '<div class="spinner"></div>';
                resetBtn.disabled = true;
                
                await firebase.auth().sendPasswordResetEmail(email);
                
                Utils.showAlert('Password reset link sent! Check your email.', 'success');
                
                setTimeout(() => {
                    window.location.href = 'signin.html';
                }, 3000);
                
            } catch (error) {
                console.error('Password reset error:', error);
                
                let errorMessage = 'Failed to send reset link. Please try again.';
                
                if (error.code === 'auth/user-not-found') {
                    errorMessage = 'No account found with this email.';
                } else if (error.code === 'auth/invalid-email') {
                    errorMessage = 'Invalid email address.';
                }
                
                Utils.showAlert(errorMessage, 'error');
                
                resetBtn.innerHTML = originalText;
                resetBtn.disabled = false;
            }
        }
        
        document.getElementById('forgot-password-form').addEventListener('submit', handleForgotPassword);
    </script>
</body>
</html>
